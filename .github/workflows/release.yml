# Builds the installer and publishes a GitHub Release for every push to the release branch.
# The version comes from Directory.Build.props; a release whose tag already exists fails, so bump it first.
name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the version check and release notes

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.SelectSingleNode('//Version').InnerText
          if (git tag --list "v$version") {
            throw "Tag v$version already exists. Bump <Version> in Directory.Build.props before releasing."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing version $version"

      - name: Publish app
        run: dotnet publish VsAssistant/VsAssistant.csproj -c Release -r win-x64 --self-contained -o publish

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          & $iscc /DAppVersion=${{ steps.version.outputs.version }} installer/VsAssistant.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ steps.version.outputs.version }}"
          "artifacts/VsAssistant-Setup-${{ steps.version.outputs.version }}.exe"
          --title "VsAssistant ${{ steps.version.outputs.version }}"
          --target "${{ github.sha }}"
          --generate-notes
